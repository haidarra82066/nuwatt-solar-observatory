name: Bug report
description: Report a reproducible platform, API, or data-contract issue.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include private installation locations, credentials, or restricted imagery.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the page, API endpoint, or release identifier.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
