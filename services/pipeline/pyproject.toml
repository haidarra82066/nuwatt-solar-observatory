[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nuwatt-observatory-pipeline"
version = "0.1.0"
description = "Evidence contracts and probabilistic PV capacity estimation for the NuWatt Observatory."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
nuwatt-pipeline = "nuwatt_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
