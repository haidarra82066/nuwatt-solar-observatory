services:
  web:
    build:
      context: .
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://observatory:observatory@postgres:5432/observatory
      NEXT_PUBLIC_DATA_RELEASE: demo-2026-01
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: observatory
      POSTGRES_USER: observatory
      POSTGRES_PASSWORD: observatory
    ports:
      - "5432:5432"
    volumes:
      - observatory-postgres:/var/lib/postgresql/data
      - ./infra/postgres/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observatory -d observatory"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  observatory-postgres:
